<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My IPTV</title>
</head>
<body>
  <h2>Loading...</h2>

  <script>
    fetch("https://YOUR-WORKER.workers.dev/playlist")
      .then(r => r.text())
      .then(text => {
        document.body.innerHTML = "<pre>"+text+"</pre>";
      })
      .catch(() => {
        document.body.innerHTML = "<h1>Access Denied</h1>";
      });
  </script>
</body>
</html>
